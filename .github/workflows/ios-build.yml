name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "src/**"
      - "public/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify web build
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios --packagemanager SPM

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Apply native app icon
        run: |
          python -m pip install --quiet pillow
          python scripts/generate-native-icons.py

      - name: Build unsigned iOS archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/AIAcquisitionSearch.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ai-acquisition-search-ios-archive
          path: ${{ runner.temp }}/AIAcquisitionSearch.xcarchive
          if-no-files-found: error
          retention-days: 14
